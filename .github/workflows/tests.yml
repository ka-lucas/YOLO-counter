name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Os testes cobrem geometria, contador, CLI, avaliação e API web, sem precisar do PyTorch
      - run: pip install numpy opencv-python-headless pytest httpx fastapi python-multipart
      - run: pytest -q
